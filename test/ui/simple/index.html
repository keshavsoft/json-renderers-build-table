<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V9 Table UI Test - json-renderers-build-table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "json-transformer-funcs": "/node_modules/json-transformer-funcs/src/v3/index.js",
      "@keshavsoft/json-to-tag": "/node_modules/@keshavsoft/json-to-tag/src/index.js"
    }
  }
  </script>
  <style>

    .test-card {
      border-radius: 8px;
      overflow: hidden;
    }
    .badge-check {
      font-size: 0.85rem;
    }
  </style>
</head>

<body class="bg-light py-4">
  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h1 class="h3 fw-bold mb-1">V9 Table Spec & DOM UI Test</h1>
        <p class="text-muted small mb-0">Testing complete cycle from <code>json-renderers-build-table</code> to DOM</p>
      </div>
      <span class="badge bg-success px-3 py-2 rounded-pill">v9 UI Test</span>
    </div>

    <!-- Test 2: Table with custom colgroup and multiple items -->
    <div class="card shadow-sm mb-4 test-card">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-0 fw-semibold">Test 2: Multi-column Table with Fixed Pixel Widths</h5>
          <small class="text-muted">Columns: ID (80px), Product Name (400px), Category (150px), Price (120px)</small>
        </div>
        <span id="test-2-status" class="badge bg-secondary badge-check">Checking...</span>
      </div>
      <div class="card-body p-0">
        <div id="table-container-2">
          <div class="p-4 text-center text-muted">Rendering Table 2...</div>
        </div>
      </div>
    </div>

    <!-- Live DOM Inspection Log -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white py-2">
        <span class="fw-semibold small">Live DOM Verification Log</span>
      </div>
      <div class="card-body bg-body-tertiary">
        <pre id="dom-log" class="mb-0 small" style="max-height: 250px; overflow-y: auto;"></pre>
      </div>
    </div>
  </main>

  <!-- <script type="module" src="./index.js"></script> -->
  <script type="module" src="/test/ui/simple/index.js"></script>

</body>

</html>
