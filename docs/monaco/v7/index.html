<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — 2D Table Builder (V6 Studio)</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <script>
        if (!window.location.pathname.endsWith("/")) {
            window.location.replace(window.location.pathname + "/");
        }
    </script>
    <div class="app-layout">
        <aside class="activity-bar" id="activityBar">
            <div class="activity-top">
                <button class="activity-btn active" id="tabBase" type="button" title="base.json (Skeleton AST)">
                    <i class="bi bi-layout-text-window text-primary"></i>
                    <span class="activity-label">base</span>
                </button>
                <button class="activity-btn" id="tabColumns" type="button" title="columns.json (Column Metadata)">
                    <i class="bi bi-layout-three-columns text-info"></i>
                    <span class="activity-label">cols</span>
                </button>
                <button class="activity-btn" id="tabData" type="button" title="data.json (Data Records)">
                    <i class="bi bi-database text-warning"></i>
                    <span class="activity-label">data</span>
                </button>
                <button class="activity-btn" id="tabColumnSpec" type="button" title="columnSpec.json (Cell Template)">
                    <i class="bi bi-code-square text-secondary"></i>
                    <span class="activity-label">colSpec</span>
                </button>
                <button class="activity-btn" id="tabRowSpec" type="button" title="rowSpec.json (Row Template)">
                    <i class="bi bi-list-nested text-secondary"></i>
                    <span class="activity-label">rowSpec</span>
                </button>
                <button class="activity-btn" id="tabOutput" type="button" title="output.json (Compiled 2D AST)">
                    <i class="bi bi-check2-circle text-success"></i>
                    <span class="activity-label">output</span>
                </button>
            </div>
            <div class="activity-bottom">
                <div class="activity-logo" title="2D Table Builder Studio">
                    <i class="bi bi-grid-3x3-gap text-secondary"></i>
                </div>
            </div>
        </aside>

        <main class="workspace-container">
            <section class="editor-pane">
                <header class="editor-header">
                    <a href="/docs/monaco/index.html" class="editor-back-link">
                        <i class="bi bi-arrow-left"></i> All versions
                    </a>
                    <span class="editor-version-label">v7</span>
                </header>

                <div class="editor-panel-body">
                    <div class="editor-toolbar">
                        <div class="spec-selector-group">
                            <div class="pill-select">
                                <span class="pill-label">Main</span>
                                <select id="mainTypeSelect" class="form-select form-select-sm"></select>
                            </div>
                            <div class="pill-select">
                                <span class="pill-label">Sub</span>
                                <select id="subTypeSelect" class="form-select form-select-sm"></select>
                            </div>
                            <button class="pill-btn fill-btn" id="fillBtn" type="button" title="Fill editor models from selected spec definition">
                                <i class="bi bi-box-arrow-in-down"></i>
                                <span>fill</span>
                            </button>
                        </div>

                        <div class="active-file-badge" id="activeFileBadge">
                            <i class="bi bi-file-earmark-code text-primary"></i>
                            <span id="activeFileName">base.json</span>
                        </div>
                    </div>

                    <div id="jsonEditor" class="editor-mount"></div>
                </div>
            </section>

            <section class="preview-pane">
                <header class="preview-header">
                    <div class="stage-title-row">
                        <div class="stage-title">
                            <i class="bi bi-display text-primary"></i>
                            <span class="title-text">Render Live Render Page</span>
                        </div>
                        <button class="action-btn clear-btn icon-only" id="clearDomBtn" type="button" title="Clear rendered DOM stage">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>

                    <div class="preview-actions">
                        <div class="target-select-group">
                            <label for="targetSelect" class="target-label">
                                <i class="bi bi-bullseye text-warning"></i>Target:
                            </label>
                            <select id="targetSelect" class="form-select form-select-sm target-select">
                                <option value="tableBody" selected>#tableBody (tbody)</option>
                            </select>
                        </div>

                        <button class="action-btn render-btn" id="renderBtn" type="button" title="Render the base table skeleton">
                            <i class="bi bi-layout-text-window"></i><span>render base</span>
                        </button>
                        <button class="action-btn build-btn" id="buildBtn" type="button" title="Run the two-dimensional transformer">
                            <i class="bi bi-play-fill"></i><span>build 2D</span>
                        </button>
                    </div>
                </header>

                <div class="preview-body">
                    <div id="renderOutput" class="stage-card">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-arrow-left-circle fs-2 text-primary d-block mb-2"></i>
                            <p class="mb-0 fw-medium">Click <strong>render base</strong>, then <strong>build 2D</strong>.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v5/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/spec-repo/dist/v6/min.js" type="module"></script>

    <script type="module" src="./js/index.js"></script>
</body>

</html>
