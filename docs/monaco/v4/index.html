<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — 2D Table Builder (V9)</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="tab-bar">
        <div class="tab-controls">
            <div class="select-group">
                <label for="mainTypeSelect">Main:</label>
                <select id="mainTypeSelect" class="form-select form-select-sm"></select>
            </div>
            <div class="select-group">
                <label for="subTypeSelect">Sub:</label>
                <select id="subTypeSelect" class="form-select form-select-sm"></select>
            </div>
            <button class="action-btn" id="fillBtn" type="button" title="Fill editor models from selected spec definition">
                <i class="bi bi-box-arrow-in-down"></i><span>fill</span>
            </button>
            <button class="action-btn" id="renderBtn" type="button" title="Render the base table skeleton">
                <i class="bi bi-layout-text-window"></i><span>render base</span>
            </button>
            <button class="action-btn" id="buildBtn" type="button" title="Run the two-dimensional transformer">
                <i class="bi bi-play-fill"></i><span>build 2D</span>
            </button>
        </div>
        <div class="editor-tabs" id="editorTabs">
            <button class="tab-item active" id="tabBase" type="button">base.json</button>
            <button class="tab-item" id="tabColumns" type="button">columns.json</button>
            <button class="tab-item" id="tabData" type="button">data.json</button>
            <button class="tab-item" id="tabColumnSpec" type="button">columnSpec.json</button>
            <button class="tab-item" id="tabRowSpec" type="button">rowSpec.json</button>
            <button class="tab-item" id="tabOutput" type="button">output.json</button>
        </div>
    </div>

    <main class="workspace-container">
        <div id="jsonEditor" class="editor-pane"></div>
        <div class="preview-pane">
            <div class="preview-header">
                <div class="d-flex align-items-center gap-2 text-nowrap">
                    <i class="bi bi-display text-primary"></i>
                    <span class="fw-semibold text-dark small">Live Render Stage</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label for="targetSelect" class="text-secondary small fw-semibold mb-0">Target:</label>
                    <select id="targetSelect" class="form-select form-select-sm text-light border-secondary"
                        style="background-color:#2d2d2d;font-size:12px;height:28px;min-width:170px;">
                        <option value="tableBody" selected>#tableBody (tbody)</option>
                    </select>
                </div>
            </div>
            <div class="preview-body">
                <div id="renderOutput" class="stage-card">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-arrow-left-circle fs-2 text-primary d-block mb-2"></i>
                        <p class="mb-0 fw-medium">Click <strong>render base</strong>, then <strong>build 2D</strong>.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v5/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js" type="module"></script>
    <script src="https://keshavsoft.github.io/spec-repo/dist/v6/min.js" type="module"></script>

    <script type="module" src="./js/index.js"></script>
</body>

</html>
