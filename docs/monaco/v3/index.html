<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — All-Declarative Table Workspace (v3)</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!-- Top Tab Bar: All 5 Declarative JSON Contracts -->
    <div class="tab-bar">
        <div class="editor-tabs" id="editorTabs">
            <button class="tab-item active" id="tabColumns" type="button" title="View Columns Schema (columns.json)">
                <i class="bi bi-columns text-info"></i>
                <span>columns.json</span>
            </button>
            <button class="tab-item" id="tabData" type="button" title="View Row Dataset (data.json)">
                <i class="bi bi-database text-warning"></i>
                <span>data.json</span>
            </button>
            <button class="tab-item" id="tabBindings" type="button" title="View Event Delegation Contract (bindings.json)">
                <i class="bi bi-diagram-2 text-success"></i>
                <span>bindings.json</span>
            </button>
            <button class="tab-item" id="tabInstructions" type="button" title="View DOM Extraction Pipeline (instructions.json)">
                <i class="bi bi-gear-wide-connected text-primary"></i>
                <span>instructions.json</span>
            </button>
            <button class="tab-item" id="tabOutput" type="button" title="View Live Extracted Output (output.json)">
                <i class="bi bi-check2-circle text-light"></i>
                <span>output.json</span>
            </button>
        </div>

        <div class="tab-actions">
            <button class="action-btn" id="columnsBtn" type="button" title="Reset sample columns JSON">
                <i class="bi bi-columns"></i>
                <span>columns</span>
            </button>
            <button class="action-btn" id="dataBtn" type="button" title="Reset sample data JSON">
                <i class="bi bi-database"></i>
                <span>data</span>
            </button>
            <button class="action-btn btn-render" id="renderBtn" type="button" title="Compile & Render Table">
                <i class="bi bi-play-fill fs-6"></i>
                <span>render</span>
            </button>

            <!-- Workspace Menu -->
            <div class="dropdown ms-1">
                <button class="btn btn-sm dropdown-toggle text-light d-flex align-items-center gap-1"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false"
                    style="background-color: #2d2d2d; border: 1px solid #3e3e42; font-size: 12px; padding: 3px 10px; height: 26px; border-radius: 4px;">
                    <i class="bi bi-layers-fill text-info"></i>
                    <span class="fw-semibold">v3</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" style="z-index: 9999; min-width: 230px; font-size: 13px;">
                    <li><h6 class="dropdown-header text-uppercase small text-secondary" style="font-size: 10px; letter-spacing: 0.5px;">Monaco Workspaces</h6></li>
                    <li><a class="dropdown-item active" href="./index.html"><i class="bi bi-check2 text-success me-1"></i><strong>v3</strong> <span class="small ms-1">— Full Declarative (All Tabs)</span></a></li>
                    <li><a class="dropdown-item" href="../table/index.html"><strong>table</strong> <span class="text-secondary small ms-1">— 50/50 Playground</span></a></li>
                    <li><a class="dropdown-item" href="../v2/index.html"><strong>v2</strong> <span class="text-secondary small ms-1">— Workspace v2</span></a></li>
                    <li><a class="dropdown-item" href="../v1/index.html"><strong>v1</strong> <span class="text-secondary small ms-1">— Workspace v1</span></a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="../index.html"><i class="bi bi-grid me-2 text-warning"></i>Monaco Hub Menu</a></li>
                    <li><a class="dropdown-item" href="../../index.html"><i class="bi bi-book me-2 text-info"></i>Table Builder Docs</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 50 / 50 Split Workspace Container -->
    <div class="workspace-container">
        <!-- Left 50%: Monaco Editor -->
        <div id="jsonEditor" class="editor-pane"></div>

        <!-- Right 50%: Live Table Render Preview -->
        <div id="previewPane" class="preview-pane">
            <div class="preview-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-table text-primary"></i>
                    <span class="fw-semibold text-dark small">Live Render &amp; Extraction</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle small">v48 Table Engine</span>
                    <span class="badge bg-success-subtle text-success border border-success-subtle small">bindings + engine</span>
                </div>
            </div>
            <div class="preview-body">
                <div id="tableRenderContainer" class="table-card">
                    <!-- Live table mounts here -->
                </div>
            </div>
            <!-- Extraction feedback toast -->
            <div id="extractionToast" class="d-none"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
