<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Table - V18</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body class="bg-light">
    <main class="container py-4">
        <div class="mb-3">
            <h1 style="font-size:1.5rem" class="mb-1">Simple Table (V18)</h1>
            <p class="text-muted small mb-0">Declarative table builder: columns drive <code>colgroup</code>,
                <code>thead</code>, and <code>tbody</code> from a single config.
            </p>
        </div>
        <div id="dom-render-container">
            <table class="table table-hover table-striped align-middle border mb-0">
                <colgroup data-role="table-colgroup">
                    <col width="50px">
                    <col width="300px">
                    <col width="200px">
                    <col width="100px">
                    <col width="100px">
                </colgroup>
                <thead class="table-dark" data-role="table-header">
                    <tr data-role="table-header-row">
                        <th class="py-3 px-3 fw-semibold text-uppercase small">#</th>
                        <th class="py-3 px-3 fw-semibold text-uppercase small">itemName</th>
                        <th class="py-3 px-3 fw-semibold text-uppercase small">baseUnit</th>
                        <th class="py-3 px-3 fw-semibold text-uppercase small">batches</th>
                        <th class="py-3 px-3 fw-semibold text-uppercase small">options</th>
                    </tr>
                </thead>
                <tbody data-role="table-body" id="table-body-id">
                                    </tbody>
            </table>
        </div>
    </main>
    <script type="module" src="./index.js"></script>
</body>

</html>
