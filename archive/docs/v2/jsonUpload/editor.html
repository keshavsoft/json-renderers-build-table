<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Editor & Visual Renderer • @keshavsoft/json-to-tag</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
      --bg-page: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --panel-header-bg: #f8fafc;
      --brand-primary: #0284c7;
      --brand-primary-hover: #0369a1;
    }

    body {
      background-color: var(--bg-page);
      font-family: var(--font-sans);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar Styling */
    .top-navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1020;
    }

    /* Controls Bar */
    .controls-bar {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    /* Workspace Split Grid */
    .workspace-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .split-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      flex: 1;
      min-height: 600px;
    }

    @media (max-width: 991px) {
      .split-grid {
        grid-template-columns: 1fr;
        min-height: auto;
      }
    }

    /* Panels */
    .workspace-panel {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      height: calc(100vh - 215px);
      min-height: 540px;
    }

    @media (max-width: 991px) {
      .workspace-panel {
        height: 520px;
      }
    }

    .panel-header {
      background: var(--panel-header-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    /* Monaco Editor Container */
    .editor-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      min-height: 0;
      height: 100%;
    }

    #monacoContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    #fallbackEditor {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      color: #0f172a;
      background: #ffffff;
      display: none;
      outline: none;
    }

    /* Output Render Preview */
    .preview-wrapper {
      flex: 1;
      overflow: auto;
      padding: 20px;
      background: #fbfcfe;
      position: relative;
    }

    #outputContainer {
      min-height: 100%;
    }

    /* Drag and Drop Overlay */
    .drag-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 132, 199, 0.08);
      border: 2px dashed #0284c7;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      font-weight: 600;
      color: #0284c7;
    }

    .workspace-panel.dragover .drag-overlay {
      display: flex;
    }

    /* Empty state styling */
    .empty-render-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 320px;
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
    }

    .empty-render-icon {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    /* Subtle pulse animation for live sync */
    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .sync-indicator.synced {
      background-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .sync-indicator.error {
      background-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .sync-indicator.syncing {
      background-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
    }
  </style>

  <!-- Monaco Editor AMD Loader from jsDelivr -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>

<body>

  <main class="container-fluid px-3 py-3 workspace-container">

    <!-- Side-by-Side Split Workspace -->
    <div class="split-grid">

      <!-- LEFT SIDE: Monaco Editor Panel -->
      <section class="workspace-panel" id="editorPanel">
        <div class="panel-header">
          <div class="panel-title text-primary">
            <i class="bi bi-code-slash"></i>
            <span>JSON Specification</span>
            <span class="badge bg-light text-muted border fw-normal text-lowercase" id="editorLineCountBadge">0
              lines</span>
          </div>
        </div>

        <div class="editor-wrapper">
          <div class="drag-overlay">
            <i class="bi bi-cloud-arrow-up fs-2 me-2"></i> Drop JSON file here to load
          </div>
          <div id="monacoContainer"></div>
          <textarea id="fallbackEditor" spellcheck="false"
            placeholder="Upload or paste JSON specification here..."></textarea>
        </div>
      </section>

      <!-- RIGHT SIDE: Rendered DOM Output Panel -->
      <section class="workspace-panel" id="previewPanel">
        <div class="panel-header">
          <div class="panel-title text-success">
            <i class="bi bi-display"></i>
            <span>Rendered Output</span>
            <span class="badge bg-light text-secondary border fw-normal" id="nodesCountBadge">0 DOM Nodes</span>
          </div>
          <button class="btn btn-primary btn-sm" type="button" id="btnManualRender"
            title="Re-render output from editor JSON">
            <i class="bi bi-play-fill me-1"></i> Render
          </button>
        </div>

        <div class="preview-wrapper">
          <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none mb-3" role="alert">
            <div class="d-flex align-items-start gap-2">
              <i class="bi bi-exclamation-triangle-fill fs-5 mt-n1"></i>
              <div class="flex-grow-1">
                <strong>Render Error:</strong>
                <span id="errorMessage" class="d-block font-monospace small mt-1"></span>
              </div>
              <button type="button" class="btn-close" id="btnCloseErrorAlert" aria-label="Close"></button>
            </div>
          </div>

          <div id="outputContainer">
            <div class="empty-render-state" id="emptyPlaceholder">
              <i class="bi bi-cloud-arrow-up empty-render-icon"></i>
              <h5 class="fw-semibold text-secondary">No Output to Display</h5>
              <p class="small text-muted mb-0">Select or upload a JSON file to render the output here.</p>
            </div>
          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
