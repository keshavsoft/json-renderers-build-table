<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Table - V18</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
</head>

<body class="bg-light">
  <main class="container py-4">
    <table class="table table-hover table-striped align-middle border mb-0">
      <colgroup data-role="table-colgroup">
        <col width="300px">
        <col width="200px">
        <col width="100px">
      </colgroup>
      <thead class="table-dark" data-role="table-header">
        <tr data-role="table-header-row">
          <th class="py-3 px-3 fw-semibold text-uppercase small">itemName</th>
          <th class="py-3 px-3 fw-semibold text-uppercase small">baseUnit</th>
          <th class="py-3 px-3 fw-semibold text-uppercase small">batches</th>
        </tr>
      </thead>
      <tbody data-role="table-body" id="tableBodyId"></tbody>
      <tfoot data-role="table-footer">
        <tr data-role="table-footer-row" id="tableFooterId"></tr>
      </tfoot>
    </table>
  </main>
  <script type="module" src="./index.js"></script>
</body>

</html>
