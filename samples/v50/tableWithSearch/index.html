<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V50 - Modular Table Operations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    #v50-staging {
      display: none !important;
    }
  </style>
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">json-renderers <span class="badge bg-primary">V50</span></span>
      <span class="navbar-text text-light">Modular Table Operations</span>
    </div>
  </nav>
  <main class="container pb-5 v50-root">
    <h1 class="h4 mb-1">Table body lifecycle — modular architecture</h1>
    <p class="text-muted small">Each operation owns its specs, bindings, and exported function.</p>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="clear-body" type="button" class="btn btn-outline-danger">
        <i class="bi bi-trash3 me-1"></i>Clear Body
      </button>
      <button id="show-body" type="button" class="btn btn-primary">
        <i class="bi bi-table me-1"></i>Show Body
      </button>
    </div>
    <div id="dom-render-container" class="mt-3"></div>
    <div id="v50-staging" aria-hidden="true"></div>
    <hr>
    <div class="small">
      <div><strong>Last action:</strong> <span id="v50-status">Rendering table…</span></div>
      <div class="mt-2"><strong>Captured Enter query:</strong></div>
      <pre id="v50-query" class="bg-white border rounded p-2 mb-0">No query captured yet.</pre>
    </div>
  </main>

  <script type="module" src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v7/min.js"></script>

  <script type="module" src="https://keshavsoft.github.io/dom-primitive-engine/dist/v18/min.js"></script>

  <script type="module" src="./index.js"></script>
</body>

</html>
