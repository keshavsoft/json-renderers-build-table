<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Footer + Data List Autocomplete</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <main class="container py-4">
    <h1 class="h3 mb-2">Table + Data List Autocomplete</h1>
    <p class="text-secondary">Type into a footer input and choose a suggestion from values already in the table.</p>
    <div id="status" class="alert alert-info py-2">Building table and data lists…</div>
    <div id="dataListsId"></div>
    <div id="dom-render-container" class="table-responsive"></div>
    <div class="small text-muted mt-3">The suggestions use the same in-memory data passed to both builders.</div>

  </main>
  <script type="module" src="./index.js"></script>
</body>

</html>
