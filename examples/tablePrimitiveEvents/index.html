<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Renderer + DOM Primitive Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="h3">Table events with DOM Primitive Engine</h1>
    <p class="text-secondary">The renderer creates the table. Instruction-driven DOM operations extract row and footer data.</p>
    <div id="table-container" class="table-responsive"></div>
    <h2 class="h5 mt-4">Event result</h2>
    <pre id="event-result" class="bg-white border rounded p-3">Click a row's Options button or the footer Save button.</pre>
  </main>
  <script type="module" src="./index.js"></script>
</body>
</html>
